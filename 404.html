<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Respec Labs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0E1A;--text:#EEF2FF;--muted:#9AA6C6;--gold:#FFC24B;--brand:#4A86AB}
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;text-align:center}
  .k{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--brand)}
  h1{font-family:"Space Grotesk",Inter,sans-serif;font-size:clamp(36px,8vw,56px);margin:14px 0 12px}
  p{color:var(--muted);font-size:17px;margin-bottom:28px}
  a{display:inline-block;background:var(--gold);color:#0A0E1A;font-weight:600;text-decoration:none;padding:13px 22px;border-radius:10px}
  a:hover{filter:brightness(1.08)}
</style>
</head>
<body>
  <main>
    <div class="k">ERROR 404 · AREA NOT FOUND</div>
    <h1>You wandered off the map.</h1>
    <p>This page doesn't exist, or it got respecced.</p>
    <a href="/">Return to base</a>
  </main>
</body>
